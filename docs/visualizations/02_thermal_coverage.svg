<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <radialGradient id="thermal" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.02"/>
    </radialGradient>
    <linearGradient id="fovGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">THERMAL COVERAGE — MLX90640 (110° FOV)</text>
  
  <!-- Pen -->
  <rect x="50" y="50" width="400" height="400" fill="none" stroke="#475569" stroke-width="2"/>
  
  <!-- FOV cone from ceiling (top-down view) -->
  <!-- At 2.5m height, 110° FOV covers ~5m diameter on ground -->
  <path d="M250,50 L50,450 L450,450 Z" fill="url(#fovGrad)" stroke="#3b82f6" stroke-width="2"/>
  
  <!-- Zones -->
  <!-- Zone 4: Near edges (partial coverage) -->
  <rect x="50" y="350" width="80" height="100" fill="#94a3b8" opacity="0.3" rx="3"/>
  <text x="90" y="405" text-anchor="middle" font-size="8" fill="#fff">Partial</text>
  
  <rect x="370" y="350" width="80" height="100" fill="#94a3b8" opacity="0.3" rx="3"/>
  <text x="410" y="405" text-anchor="middle" font-size="8" fill="#fff">Partial</text>
  
  <!-- Zone 1-4 (quadrants) -->
  <rect x="60" y="60" width="90" height="90" fill="#f59e0b" opacity="0.2" rx="3"/>
  <text x="105" y="110" text-anchor="middle" font-size="9" fill="#f59e0b">Zone 1</text>
  
  <rect x="160" y="60" width="90" height="90" fill="#f59e0b" opacity="0.2" rx="3"/>
  <text x="205" y="110" text-anchor="middle" font-size="9" fill="#f59e0b">Zone 2</text>
  
  <rect x="60" y="160" width="90" height="90" fill="#f59e0b" opacity="0.2" rx="3"/>
  <text x="105" y="210" text-anchor="middle" font-size="9" fill="#f59e0b">Zone 3</text>
  
  <rect x="160" y="160" width="90" height="90" fill="#f59e0b" opacity="0.2" rx="3"/>
  <text x="205" y="210" text-anchor="middle" font-size="9" fill="#f59e0b">Zone 4</text>
  
  <!-- Center zone (best coverage) -->
  <rect x="100" y="100" width="100" height="100" fill="#22c55e" opacity="0.25" rx="3"/>
  <text x="150" y="155" text-anchor="middle" font-size="10" fill="#22c55e" font-weight="bold">BEST</text>
  
  <!-- MLX90640 sensor -->
  <rect x="230" y="40" width="40" height="20" fill="#3b82f6" rx="3"/>
  <text x="250" y="53" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">MLX</text>
  
  <!-- 110° angle indicator -->
  <path d="M250,60 L200,90 L300,90 Z" fill="#3b82f6" opacity="0.4"/>
  <text x="250" y="85" text-anchor="middle" font-size="8" fill="#fff">110°</text>
  
  <!-- Pigs -->
  <circle cx="120" cy="130" r="10" fill="#f97316" opacity="0.8"/>
  <text x="120" y="135" text-anchor="middle" font-size="8" fill="#fff">P1</text>
  
  <circle cx="300" cy="280" r="10" fill="#f97316" opacity="0.8"/>
  <text x="300" y="285" text-anchor="middle" font-size="8" fill="#fff">P2</text>
  
  <circle cx="80" cy="380" r="10" fill="#f97316" opacity="0.5"/>
  <text x="80" y="385" text-anchor="middle" font-size="8" fill="#fff">P3?</text>
  
  <!-- Legend -->
  <rect x="460" y="80" width="130" height="120" fill="#f8fafc" stroke="#e2e8f0" rx="5"/>
  <text x="475" y="100" font-size="9" font-weight="bold" fill="#475569">THERMAL NOTES</text>
  <text x="475" y="118" font-size="8" fill="#64748b">• 32×24 pixels total</text>
  <text x="475" y="134" font-size="8" fill="#64748b">• Each pixel = 6×6cm @2m</text>
  <text x="475" y="150" font-size="8" fill="#64748b">• Ear = 2-3 pixels (can't detect)</text>
  <text x="475" y="166" font-size="8" fill="#64748b">• Zone-level only</text>
  <text x="475" y="182" font-size="8" fill="#64748b">• ±1.7°C accuracy</text>
  <text x="475" y="198" font-size="8" fill="#64748b">• Sunlight = blind spot</text>
  
  <!-- Coverage note -->
  <rect x="50" y="465" width="380" height="25" fill="#eff6ff" stroke="#bfdbfe" rx="5"/>
  <text x="60" y="482" font-size="9" fill="#1e40af">📊 FOV covers full pen but resolution too low for individual pigs. Zone-level only.</text>
</svg>