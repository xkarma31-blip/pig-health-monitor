<!DOCTYPE html>

<style>

p { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 20px; }

<h1>🐷 PigPulse Coverage Analysis</h1>
<p>Full visualization of audio, thermal, CCTV, and multi-modal fusion coverage</p>
<div class="grid">
