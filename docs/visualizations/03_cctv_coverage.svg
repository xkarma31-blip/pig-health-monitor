<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="cctvFov" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">CCTV COVERAGE — 1080p Top-Down View</text>
  
  <!-- Pen -->
  <rect x="50" y="50" width="400" height="400" fill="none" stroke="#475569" stroke-width="2"/>
  
  <!-- CCTV FOV (90° typical ceiling mount) -->
  <path d="M250,50 L50,450 L450,450 Z" fill="url(#cctvFov)" stroke="#8b5cf6" stroke-width="2"/>
  
  <!-- Grid overlay (pixels) -->
  <g opacity="0.1">
    <line x1="50" y1="100" x2="450" y2="100" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="50" y1="150" x2="450" y2="150" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="50" y1="200" x2="450" y2="200" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="50" y1="250" x2="450" y2="250" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="50" y1="300" x2="450" y2="300" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="50" y1="350" x2="450" y2="350" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="50" y1="400" x2="450" y2="400" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="100" y1="50" x2="100" y2="450" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="150" y1="50" x2="150" y2="450" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="200" y1="50" x2="200" y2="450" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="250" y1="50" x2="250" y2="450" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="300" y1="50" x2="300" y2="450" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="350" y1="50" x2="350" y2="450" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="400" y1="50" x2="400" y2="450" stroke="#8b5cf6" stroke-width="0.5"/>
  </g>
  
  <!-- CCTV camera -->
  <rect x="230" y="35" width="40" height="20" fill="#8b5cf6" rx="3"/>
  <text x="250" y="48" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">CCTV</text>
  
  <!-- YOLO bounding boxes -->
  <rect x="80" y="150" width="60" height="40" fill="none" stroke="#f97316" stroke-width="2" rx="2"/>
  <text x="90" y="145" font-size="8" fill="#f97316">Pig 1</text>
  
  <rect x="280" y="300" width="60" height="40" fill="none" stroke="#f97316" stroke-width="2" rx="2"/>
  <text x="290" y="295" font-size="8" fill="#f97316">Pig 2</text>
  
  <rect x="370" y="130" width="60" height="40" fill="none" stroke="#f97316" stroke-width="2" rx="2"/>
  <text x="380" y="125" font-size="8" fill="#f97316">Pig 3</text>
  
  <!-- Partially occluded pig -->
  <rect x="60" y="370" width="60" height="40" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4,2" rx="2" opacity="0.6"/>
  <text x="70" y="365" font-size="8" fill="#f97316">Pig 4?</text>
  
  <!-- Behavior labels -->
  <text x="110" y="175" font-size="7" fill="#166534">Standing</text>
  <text x="310" y="325" font-size="7" fill="#166534">Lying</text>
  <text x="400" y="155" font-size="7" fill="#166534">Eating</text>
  
  <!-- Legend -->
  <rect x="460" y="80" width="130" height="120" fill="#f8fafc" stroke="#e2e8f0" rx="5"/>
  <text x="475" y="100" font-size="9" font-weight="bold" fill="#475569">CCTV NOTES</text>
  <text x="475" y="118" font-size="8" fill="#64748b">• 1920×1080 pixels</text>
  <text x="475" y="134" font-size="8" fill="#64748b">• Pig ear = ~75×105 px</text>
  <text x="475" y="150" font-size="8" fill="#64748b">• Can detect individual pigs</text>
  <text x="475" y="166" font-size="8" fill="#64748b">• YOLO: 92-99% mAP</text>
  <text x="475" y="182" font-size="8" fill="#64748b">• ByteTrack: 97% MOTA</text>
  <text x="475" y="198" font-size="8" fill="#64748b">• Behavior recognition</text>
  
  <!-- Coverage note -->
  <rect x="50" y="465" width="380" height="25" fill="#faf5ff" stroke="#e9d5ff" rx="5"/>
  <text x="60" y="482" font-size="9" fill="#6b21a8">📊 Full pen coverage. YOLO detects pigs, ByteTrack assigns IDs, monitors behavior.</text>
</svg>