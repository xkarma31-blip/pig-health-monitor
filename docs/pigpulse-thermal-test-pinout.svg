<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="monospace">
  <rect width="800" height="500" fill="#1a1a2e"/>
  <text x="400" y="30" text-anchor="middle" fill="#00d4ff" font-size="16" font-weight="bold">PigPulse - ESP32 + MLX90640 Thermal Camera Test</text>

  <!-- Breadboard -->
  <rect x="100" y="60" width="600" height="200" rx="6" fill="#0f3460" stroke="#533483" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">Breadboard</text>

  <!-- ESP32 on left -->
  <rect x="120" y="100" width="180" height="140" rx="4" fill="#16213e" stroke="#00d4ff" stroke-width="2"/>
  <text x="210" y="120" text-anchor="middle" fill="#00d4ff" font-size="11" font-weight="bold">ESP32-WROOM-32D</text>
  <text x="210" y="135" text-anchor="middle" fill="#aaa" font-size="9">3.3V  GND  GPIO21  GPIO22</text>

  <!-- MLX90640 on right -->
  <rect x="500" y="100" width="180" height="140" rx="4" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="590" y="120" text-anchor="middle" fill="#e94560" font-size="11" font-weight="bold">MLX90640</text>
  <text x="590" y="135" text-anchor="middle" fill="#aaa" font-size="9">VCC  GND  SDA  SCL</text>

  <!-- Wire connections -->
  <!-- 3.3V to VCC (red) -->
  <line x1="280" y1="150" x2="520" y2="150" stroke="#ff0000" stroke-width="3"/>
  <text x="400" y="145" text-anchor="middle" fill="#ff0000" font-size="9">3.3V</text>

  <!-- GND to GND (black) -->
  <line x1="280" y1="170" x2="520" y2="170" stroke="#ffffff" stroke-width="3"/>
  <text x="400" y="190" text-anchor="middle" fill="#ffffff" font-size="9">GND</text>

  <!-- SDA to SDA (yellow) -->
  <line x1="280" y1="200" x2="520" y2="200" stroke="#ffd700" stroke-width="3"/>
  <text x="400" y="220" text-anchor="middle" fill="#ffd700" font-size="9">SDA (GPIO 21)</text>

  <!-- SCL to SCL (blue) -->
  <line x1="280" y1="230" x2="520" y2="230" stroke="#00d4ff" stroke-width="3"/>
  <text x="400" y="250" text-anchor="middle" fill="#00d4ff" font-size="9">SCL (GPIO 22)</text>

  <!-- Pull-up resistors -->
  <rect x="320" y="270" width="160" height="20" fill="#533483" stroke="#ffd700" stroke-width="1"/>
  <text x="400" y="284" text-anchor="middle" fill="#ffd700" font-size="9">4.7k pull-ups: SDA, SCL to 3.3V</text>

  <!-- Pin connection summary box -->
  <rect x="100" y="310" width="600" height="170" rx="6" fill="#16213e" stroke="#00d4ff" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="bold">Wiring Summary</text>

  <!-- ESP32 pins column -->
  <text x="120" y="355" fill="#00d4ff" font-size="10" font-weight="bold">ESP32 Pin</text>
  <text x="120" y="375" fill="#ff0000" font-size="10">3.3V</text>
  <text x="120" y="395" fill="#ffffff" font-size="10">GND</text>
  <text x="120" y="415" fill="#ffd700" font-size="10">GPIO 21</text>
  <text x="120" y="435" fill="#00d4ff" font-size="10">GPIO 22</text>

  <!-- Arrow -->
  <text x="250" y="375" fill="#aaa" font-size="10">--------&gt;</text>
  <text x="250" y="395" fill="#aaa" font-size="10">--------&gt;</text>
  <text x="250" y="415" fill="#aaa" font-size="10">--------&gt;</text>
  <text x="250" y="435" fill="#aaa" font-size="10">--------&gt;</text>

  <!-- MLX90640 pins column -->
  <text x="400" y="355" fill="#e94560" font-size="10" font-weight="bold">MLX90640 Pin</text>
  <text x="400" y="375" fill="#ff0000" font-size="10">VCC</text>
  <text x="400" y="395" fill="#ffffff" font-size="10">GND</text>
  <text x="400" y="415" fill="#ffd700" font-size="10">SDA</text>
  <text x="400" y="435" fill="#00d4ff" font-size="10">SCL</text>

  <!-- Wire colors -->
  <text x="580" y="355" fill="#aaa" font-size="10" font-weight="bold">Wire</text>
  <text x="580" y="375" fill="#ff0000" font-size="10">Red</text>
  <text x="580" y="395" fill="#ffffff" font-size="10">Black</text>
  <text x="580" y="415" fill="#ffd700" font-size="10">Yellow</text>
  <text x="580" y="435" fill="#00d4ff" font-size="10">Blue</text>

  <!-- Notes -->
  <text x="120" y="465" fill="#ffd700" font-size="9">Note: Add 4.7k resistors from SDA to 3.3V and SCL to 3.3V (pull-ups)</text>
</svg>