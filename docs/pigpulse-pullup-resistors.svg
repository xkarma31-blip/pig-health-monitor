<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="monospace">
  <rect width="700" height="450" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" fill="#00d4ff" font-size="14" font-weight="bold">What Are I2C Pull-Up Resistors?</text>
  
  <!-- Section 1: Without Pull-Ups -->
  <rect x="20" y="50" width="310" height="160" rx="6" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="175" y="70" text-anchor="middle" fill="#e94560" font-size="12" font-weight="bold">Without Pull-Ups (BROKEN)</text>
  
  <!-- Signal line floating -->
  <rect x="40" y="85" width="270" height="40" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
  <text x="175" y="100" text-anchor="middle" fill="#fff" font-size="10">SDA/SCL line — FLOATING</text>
  <text x="175" y="118" text-anchor="middle" fill="#e94560" font-size="9">??? Random noise, never goes HIGH reliably</text>
  
  <!-- ESP32 trying to send -->
  <rect x="40" y="135" width="80" height="30" fill="#533483" stroke="#00d4ff" stroke-width="1"/>
  <text x="80" y="150" text-anchor="middle" fill="#fff" font-size="9">ESP32 sends 1</text>
  <text x="80" y="160" text-anchor="middle" fill="#aaa" font-size="8">line goes LOW</text>
  
  <rect x="130" y="135" width="80" height="30" fill="#533483" stroke="#e94560" stroke-width="1"/>
  <text x="170" y="150" text-anchor="middle" fill="#fff" font-size="9">ESP32 sends 0</text>
  <text x="170" y="160" text-anchor="middle" fill="#e94560" font-size="8">line goes LOW</text>
  
  <rect x="220" y="135" width="80" height="30" fill="#533483" stroke="#ffd700" stroke-width="1"/>
  <text x="260" y="150" text-anchor="middle" fill="#ffd700" font-size="9">Result</text>
  <text x="260" y="160" text-anchor="middle" fill="#e94560" font-size="8">ALWAYS LOW!</text>
  
  <text x="175" y="190" text-anchor="middle" fill="#e94560" font-size="10" font-weight="bold">CANNOT WORK</text>
  
  <!-- Section 2: With Pull-Ups -->
  <rect x="370" y="50" width="310" height="160" rx="6" fill="#16213e" stroke="#00d4ff" stroke-width="2"/>
  <text x="525" y="70" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="bold">With Pull-Ups (WORKING)</text>
  
  <!-- 3.3V rail with resistor -->
  <rect x="390" y="85" width="270" height="40" fill="#0f3460" stroke="#00d4ff" stroke-width="1"/>
  <text x="525" y="100" text-anchor="middle" fill="#fff" font-size="10">SDA/SCL line — pulled HIGH by resistor</text>
  <text x="525" y="118" text-anchor="middle" fill="#00d4ff" font-size="9">??? Stays HIGH until pulled LOW</text>
  
  <!-- ESP32 sends -->
  <rect x="390" y="135" width="80" height="30" fill="#533483" stroke="#00d4ff" stroke-width="1"/>
  <text x="430" y="150" text-anchor="middle" fill="#fff" font-size="9">ESP32 sends 1</text>
  <text x="430" y="160" text-anchor="middle" fill="#00d4ff" font-size="8">line stays HIGH</text>
  
  <rect x="480" y="135" width="80" height="30" fill="#533483" stroke="#e94560" stroke-width="1"/>
  <text x="520" y="150" text-anchor="middle" fill="#fff" font-size="9">ESP32 sends 0</text>
  <text x="520" y="160" text-anchor="middle" fill="#e94560" font-size="8">line pulled LOW</text>
  
  <rect x="570" y="135" width="80" height="30" fill="#533483" stroke="#00d4ff" stroke-width="1"/>
  <text x="610" y="150" text-anchor="middle" fill="#00d4ff" font-size="9">Result</text>
  <text x="610" y="160" text-anchor="middle" fill="#00d4ff" font-size="8">WORKS!</text>
  
  <text x="525" y="190" text-anchor="middle" fill="#00d4ff" font-size="10" font-weight="bold">CAN COMMUNICATE</text>
  
  <!-- Explanation Box -->
  <rect x="20" y="230" width="660" height="80" rx="6" fill="#16213e" stroke="#ffd700" stroke-width="2"/>
  <text x="350" y="250" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">Why Is It Needed?</text>
  <text x="40" y="270" fill="#fff" font-size="10">I2C uses OPEN-DRAIN outputs. Devices can only pull the line LOW (to GND).</text>
  <text x="40" y="285" fill="#fff" font-size="10">They CANNOT actively push the line HIGH. The pull-up resistor connects the line to 3.3V</text>
  <text x="40" y="300" fill="#fff" font-size="10">so it returns to HIGH when no device is pulling it LOW. 4.7kOhm = standard value.</text>
  
  <!-- How To Wire Box -->
  <rect x="20" y="330" width="660" height="100" rx="6" fill="#16213e" stroke="#00d4ff" stroke-width="2"/>
  <text x="350" y="350" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="bold">How to Add Them (Physical Wiring)</text>
  
  <!-- Diagram of resistor placement -->
  <text x="40" y="375" fill="#ffd700" font-size="10">Step 1: Connect one leg of 4.7kOhm resistor to SDA line (same row as ESP32 GPIO21)</text>
  <text x="40" y="395" fill="#00d4ff" font-size="10">Step 2: Connect other leg to 3.3V rail (red power rail on breadboard)</text>
  <text x="40" y="410" fill="#ffd700" font-size="10">Step 3: Repeat for SCL line: 4.7kOhm resistor from SCL to 3.3V</text>
</svg>