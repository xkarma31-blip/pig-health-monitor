# CodeRabbit repo config template — copy to project root as .coderabbit.yaml
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - master
      - develop
  path_filters:
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/.venv/**"
    - "!**/venv/**"
    - "!**/node_modules/**"
    - "!**/__pycache__/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.expo/**"
  path_instructions:
    - path: "**/*.{ts,tsx,js,jsx}"
      instructions: >
        React Native / Expo project. Check hooks deps, navigation types,
        accessibility (labels, contrast), and avoid blocking the JS thread.
    - path: "**/*.py"
      instructions: >
        Python ML / backend. Check error handling, type hints on public APIs,
        and memory use on 8GB dev machine.
    - path: "**/*.{sh,bash}"
      instructions: >
        Use set -euo pipefail for production scripts; quote variables;
        prefer idempotent operations.
chat:
  auto_reply: true
