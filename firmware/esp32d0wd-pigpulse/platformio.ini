; PigPulse v1.0 - ESP32-D0WD build configuration (PlatformIO alternative)
;
; Primary workflow is Arduino IDE (matches the reference project):
;   1. Copy downloads/esp32-mlx90640-thermal-camera/mlx90640-custom-library.zip
;      into Arduino IDE via Sketch > Include Library > Add .ZIP Library.
;   2. Tools > Board > "ESP32 Dev Module", correct COM port (FTDI -> PROG header).
;   3. Open esp32d0wd-pigpulse.ino and Upload.
;
; PlatformIO alternative:
;   Install: pip install platformio
;   Build:   pio run
;   Upload:  pio run --target upload
;   Monitor: pio device monitor
;
; NOTE: PlatformIO compiles the .ino sketch directly - no shim needed.

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev          ; ESP32-D0WD / WROOM-32 (NOT -S3)
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_otaready.csv
board_build.flash_mode = dio

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    ; Local MLX90640 driver from the reference download bundle
    file://../../downloads/esp32-mlx90640-thermal-camera/mlx90640-custom-library.zip
    ; Fallback if the zip is missing (API-compatible Melexis driver):
    ; https://github.com/melexis/mlx90640-library.git
    ; Captive-portal WiFi provisioning (join any network from the phone)
    tzapu/WiFiManager @ ^2.0.17
    ; MQTT client for PocketBase telemetry pipeline
    knolleary/PubSubClient @ ^2.8
