version: '3.8'

# PigPulse v3 — Development Docker Stack
# For local development with hot-reload
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  # ── MQTT Broker ──────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pigpulse-mosquitto-dev
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data-dev:/mosquitto/data
    networks:
      - pigpulse-net-dev

  # ── Database + API ──────────────────────────────────────────
  pocketbase:
    image: pocketbase/pocketbase:latest
    container_name: pigpulse-pocketbase-dev
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "8091:8091"
    volumes:
      - pocketbase-data-dev:/pb/pb_data
    command: serve --http=0.0.0.0:8090 --admin=0.0.0.0:8091
    networks:
      - pigpulse-net-dev

  # ── Cache + Buffer ─────────────────────────────────────────
  valkey:
    image: valkey/valkey:8
    container_name: pigpulse-valkey-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: valkey-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey-data-dev:/data
    networks:
      - pigpulse-net-dev

  # ── API Gateway (OpenResty) ────────────────────────────────
  openresty:
    image: openresty/openresty:alpine
    container_name: pigpulse-openresty-dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./openresty/conf/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./openresty/lua:/etc/nginx/lua
    depends_on:
      - pocketbase
    networks:
      - pigpulse-net-dev

  # ── MQTT → PocketBase Bridge ──────────────────────────────
  mqtt-bridge:
    build:
      context: ../backend/bridge
      dockerfile: Dockerfile
    container_name: pigpulse-bridge-dev
    restart: unless-stopped
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - POCKETBASE_URL=http://pocketbase:8090
      - VALKEY_URL=redis://valkey:6379
      - PB_EMAIL=${PB_EMAIL:-admin@pigpulse.local}
      - PB_PASSWORD=${PB_PASSWORD:-admin123}
    volumes:
      - ../backend/bridge:/app  # Hot-reload in dev
    depends_on:
      - mosquitto
      - pocketbase
      - valkey
    networks:
      - pigpulse-net-dev

networks:
  pigpulse-net-dev:
    driver: bridge

volumes:
  mosquitto-data-dev:
  pocketbase-data-dev:
  valkey-data-dev:
