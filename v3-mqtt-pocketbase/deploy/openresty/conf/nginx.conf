worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log info;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    lua_package_path "/etc/nginx/lua/?.lua;;";

    lua_shared_dict rate_limit_store 10m;
    lua_shared_dict cache_store 50m;
    lua_shared_dict jwt_store 5m;

    resolver 127.0.0.11 valid=30s;

    init_worker_by_lua_block {
        local limit = require "resty.limit.req"
        local lim, err = limit.new("rate_limit_store", 100, 60)
        if not lim then
            ngx.log(ngx.ERR, "failed to instantiate rate limiter: ", err)
        end
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"pigpulse"}';
            add_header Content-Type application/json;
        }

        location /api/ {
            access_by_lua_block {
                local limit = require "resty.limit.req"
                local lim, err = limit.new("rate_limit_store", 100, 60)
                if lim then
                    local key = ngx.var.binary_remote_addr
                    local delay, err = lim:incoming(key, true)
                    if not delay then
                        if err == "rejected" then
                            ngx.header["Retry-After"] = 60
                            return ngx.exit(429)
                        end
                    end
                end
            }

            set $pb_upstream "http://172.18.0.1:8090";
            proxy_pass $pb_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache_valid 200 5s;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;
        }

        location /api/realtime {
            set $pb_upstream "http://172.18.0.1:8090";
            proxy_pass $pb_upstream/api/realtime;
            proxy_set_header Host $host;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;

            add_header Cache-Control no-cache;
            add_header X-Accel-Buffering no;
        }

        location /admin/ {
            set $pb_admin_upstream "http://172.18.0.1:8090";
            proxy_pass $pb_admin_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /mqtt {
            set $mqtt_upstream "pigpulse-mosquitto:9001";
            proxy_pass http://$mqtt_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        location /thermal-ws {
            set $thermal_upstream "pigpulse-thermal-ws:8080";
            proxy_pass http://$thermal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        location / {
            set $pb_upstream "http://172.18.0.1:8090";
            proxy_pass $pb_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
