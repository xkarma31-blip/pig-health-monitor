worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log info;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    lua_package_path "/etc/nginx/lua/?.lua;;";

    lua_shared_dict rate_limit_store 10m;
    lua_shared_dict cache_store 50m;
    lua_shared_dict jwt_store 5m;

    init_worker_by_lua_block {
        local limit = require "resty.limit.req"
        local lim, err = limit.new("rate_limit_store", 100, 60)
        if not lim then
            ngx.log(ngx.ERR, "failed to instantiate rate limiter: ", err)
        end
    }

    upstream pocketbase {
        server 127.0.0.1:8090;
        keepalive 32;
    }

    upstream mosquitto_ws {
        server 127.0.0.1:9001;
    }

    upstream thermal_ws {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"pigpulse"}';
            add_header Content-Type application/json;
        }

        location /api/ {
            access_by_lua_block {
                local limit = require "resty.limit.req"
                local lim, err = limit.new("rate_limit_store", 100, 60)
                if lim then
                    local key = ngx.var.binary_remote_addr
                    local delay, err = lim:incoming(key, true)
                    if not delay then
                        if err == "rejected" then
                            ngx.header["Retry-After"] = 60
                            return ngx.exit(429)
                        end
                    end
                end
            }

            proxy_pass http://pocketbase/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /api/realtime {
            proxy_pass http://pocketbase/api/realtime;
            proxy_set_header Host $host;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # -- Admin surface: loopback only -------------------------------
        # PocketBase serves its admin UI under /_/. The catch-all `location /`
        # below proxies to PocketBase, so without this guard the admin panel
        # rides the public API path. Admin is reachable ONLY on this machine,
        # directly at http://127.0.0.1:8090/_/ -- never through the gateway.
        # The public dashboard reads telemetry through the read-only
        # serverless proxy (api/telemetry.js), not through this gateway.
        location /_/ {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            access_log off;
            return 403;
        }

        location /admin/ {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            access_log off;
            return 403;
        }

        location /mqtt {
            proxy_pass http://mosquitto_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        location /thermal-ws {
            proxy_pass http://thermal_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass http://pocketbase;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
