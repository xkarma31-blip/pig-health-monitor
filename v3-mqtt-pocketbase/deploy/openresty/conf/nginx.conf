worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log info;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ── Lua Package Path ─────────────────────────────────────
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # ── Shared Memory Zones ──────────────────────────────────
    lua_shared_dict rate_limit_store 10m;
    lua_shared_dict cache_store 50m;
    lua_shared_dict jwt_store 5m;

    # ── Rate Limiting ────────────────────────────────────────
    # 100 requests per minute per IP
    init_worker_by_lua_block {
        local limit = require "resty.rate limiting"
        local lim, err = limit.new("rate_limit_store", 100, 60)
        if not lim then
            ngx.log(ngx.ERR, "failed to instantiate rate limiter: ", err)
        end
    }

    # ── Upstream: PocketBase ─────────────────────────────────
    upstream pocketbase {
        server pocketbase:8090;
        keepalive 32;
    }

    upstream pocketbase_admin {
        server pocketbase:8091;
        keepalive 16;
    }

    # ── Server Block ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # ── Health Check ─────────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"pigpulse"}';
            add_header Content-Type application/json;
        }

        # ── Rate Limiting + Auth for API ────────────────────
        location /api/ {
            # Rate limiting
            access_by_lua_block {
                local limit = require "resty.rate limiting"
                local lim, err = limit.new("rate_limit_store", 100, 60)
                if lim then
                    local key = ngx.var.binary_remote_addr
                    local delay, err = lim:incoming(key, true)
                    if not delay then
                        if err == "rejected" then
                            ngx.header["Retry-After"] = 60
                            return ngx.exit(429)
                        end
                    end
                end
            }

            # Proxy to PocketBase
            proxy_pass http://pocketbase/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Caching for read-heavy endpoints
            proxy_cache_valid 200 5s;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ── PocketBase Realtime SSE ──────────────────────────
        location /api/realtime {
            proxy_pass http://pocketbase/api/realtime;
            proxy_set_header Host $host;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;

            # SSE headers
            add_header Cache-Control no-cache;
            add_header X-Accel-Buffering no;
        }

        # ── PocketBase Admin ─────────────────────────────────
        location /admin/ {
            proxy_pass http://pocketbase_admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── WebSocket Proxy (MQTT over WS) ──────────────────
        location /mqtt {
            proxy_pass http://mosquitto:9001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # ── Default → PocketBase ─────────────────────────────
        location / {
            proxy_pass http://pocketbase;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
