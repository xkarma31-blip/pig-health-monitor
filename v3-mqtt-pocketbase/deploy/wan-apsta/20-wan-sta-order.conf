[Unit]
# Pull the AP channel planner and the uplink in before the AP, and order hostapd
# behind both. hostapd must NOT start first: the driver will not scan while an
# AP vif beacons, and an association without a scan carries no BSSID, which lets
# the firmware wander to the venue's 5 GHz BSS and take the radio (and the AP)
# with it.
Wants=pigpulse-wan-ap-conf.service pigpulse-wan-sta.service
After=pigpulse-wan-ap-conf.service pigpulse-wan-sta.service
