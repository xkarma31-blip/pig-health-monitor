[keyfile]
# wlan0  = the AP, driven by hostapd/dnsmasq.
# wlan0sta = the optional uplink, driven by wpa_supplicant/dhcpcd.
# wlan1  = the RTL8188CUS dongle (RF-dead, 2026-11-12). Kept unmanaged so NM
#          stops probing hardware that cannot work; a replacement 2.4 GHz
#          adapter will also land on wlan1 and will be driven by hostapd, not NM.
# NetworkManager must own none of these: its periodic background scans are what
# move the radio and drop AP clients.
unmanaged-devices=interface-name:wlan0;interface-name:wlan0sta;interface-name:wlan1
