<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui, sans-serif">
  <rect width="960" height="520" fill="#1a1a2e"/>
  <text x="20" y="38" fill="#22d3ee" font-size="22" font-weight="bold">PigPulse v3 — Architecture Overview</text>
  <text x="20" y="58" fill="#94a3b8" font-size="13">Sim-proven loop · branch feat/v3-mqtt-pocketbase · diagrams are [spec/sim] — not measured from live hardware</text>

  <!-- ESP32 nodes -->
  <g>
    <rect x="20" y="120" width="200" height="150" rx="12" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
    <text x="40" y="150" fill="#22d3ee" font-size="16" font-weight="bold">ESP32-S3 nodes ×2</text>
    <text x="40" y="178" fill="#e2e8f0" font-size="13">mic — 8 kHz cough ring</text>
    <text x="40" y="198" fill="#e2e8f0" font-size="13">MLX90640 — 32×24 ROI</text>
    <text x="40" y="218" fill="#e2e8f0" font-size="13">watchdog: STFT→Mel→band</text>
    <text x="40" y="238" fill="#e2e8f0" font-size="13">RDI 24-bin rolling day</text>
    <text x="40" y="258" fill="#94a3b8" font-size="12">[sim: engines/virtualEsp32]</text>
  </g>

  <!-- Mosquitto -->
  <g>
    <rect x="280" y="120" width="160" height="120" rx="12" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
    <text x="300" y="150" fill="#22d3ee" font-size="16" font-weight="bold">Mosquitto</text>
    <text x="300" y="176" fill="#e2e8f0" font-size="13">MQTT :1883</text>
    <text x="300" y="196" fill="#e2e8f0" font-size="13">Docker</text>
    <text x="300" y="222" fill="#94a3b8" font-size="12">pigpulse/# topics</text>
  </g>

  <!-- Bridge -->
  <g>
    <rect x="500" y="120" width="180" height="120" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <text x="520" y="150" fill="#f59e0b" font-size="16" font-weight="bold">MQTT Bridge</text>
    <text x="520" y="176" fill="#e2e8f0" font-size="13">systemd native</text>
    <text x="520" y="196" fill="#e2e8f0" font-size="13">→ PocketBase write</text>
    <text x="520" y="222" fill="#94a3b8" font-size="12">measured: bridge restarts</text>
  </g>

  <!-- PocketBase -->
  <g>
    <rect x="740" y="120" width="190" height="140" rx="12" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
    <text x="760" y="150" fill="#22d3ee" font-size="16" font-weight="bold">PocketBase</text>
    <text x="760" y="176" fill="#e2e8f0" font-size="13">native :8090</text>
    <text x="760" y="196" fill="#e2e8f0" font-size="13">telemetry + alerts</text>
    <text x="760" y="216" fill="#e2e8f0" font-size="13">retention 7d / 20 k</text>
    <text x="760" y="236" fill="#e2e8f0" font-size="13">vet labels, suspect flags</text>
  </g>

  <!-- OpenResty + Expo -->
  <g>
    <rect x="740" y="340" width="190" height="80" rx="12" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
    <text x="760" y="368" fill="#22d3ee" font-size="15" font-weight="bold">OpenResty :80</text>
    <text x="760" y="392" fill="#e2e8f0" font-size="13">API gateway (native)</text>
  </g>
  <g>
    <rect x="280" y="360" width="180" height="80" rx="12" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
    <text x="300" y="388" fill="#22d3ee" font-size="15" font-weight="bold">Expo app (phone)</text>
    <text x="300" y="412" fill="#e2e8f0" font-size="13">PocketBase auth</text>
  </g>

  <!-- Arrows -->
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#22d3ee"/></marker></defs>
  <line x1="220" y1="180" x2="272" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="180" x2="492" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)"/>
  <line x1="680" y1="180" x2="732" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)"/>
  <line x1="835" y1="260" x2="835" y2="332" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="400" x2="650" y2="400" stroke="#22d3ee" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/>
  <text x="430" y="390" fill="#94a3b8" font-size="12">REST via gateway</text>

  <!-- Pi 5 note -->
  <g>
    <rect x="20" y="360" width="220" height="80" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <text x="40" y="388" fill="#f59e0b" font-size="15" font-weight="bold">Pi 5 edge</text>
    <text x="40" y="412" fill="#e2e8f0" font-size="13">35 ms budget (STFT 2 · Mel 5 · CNN-LSTM 22 · thermal 6)</text>
  </g>
</svg>