# PigPulse v3 — Mosquitto MQTT Broker Configuration for Raspberry Pi (Native)
# Location: /etc/mosquitto/conf.d/pigpulse.conf

# Standard MQTT port for ESP32 nodes and local bridge
listener 1883 0.0.0.0

# WebSocket port for Expo Web browser clients
listener 9001 0.0.0.0
protocol websockets

# NOTE (2026-09-28): persistence/persistence_location/log_dest are DELIBERATELY
# NOT set here. /etc/mosquitto/mosquitto.conf already sets them (bootstrap
# writes that file), and mosquitto 2.0 treats a DUPLICATE persistence_location
# as a fatal config error -> exit status 3 -> systemd Restart=on-failure loop
# -> port 1883 never listens -> every ESP connect fails rc=-2.
# The broker crash-looped like that on the Pi from 2026-09-23 to 2026-09-28.
# Leave these three lines out. autosave_interval below is safe (not duplicated).
# persistence_location and log_dest file are owned by /etc/mosquitto/mosquitto.conf
# — do NOT repeat either here: mosquitto 2.0 fatals on duplicates ("Duplicate
# persistence_location value" / "Duplicate "log_dest file" value" -> exit 3 loop).
autosave_interval 1800

# Local pen operation allows anonymous connections on local subnet (192.168.4.x)
allow_anonymous true

# Logging (log_dest file is set by the main conf — only types are set here)
log_type error
log_type warning
log_type notice
log_type information
