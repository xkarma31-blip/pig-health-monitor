[Service]
# Tapo RTSP credentials for /camera-audio. Read by systemd as root before the
# unit drops to User=pigpulse, so the 0600 env file stays unreadable by the
# service account. The leading '-' makes the unit start even if the file is
# absent — the endpoint then fails closed with 503 instead of taking the
# thermal console down.
EnvironmentFile=-/etc/pigpulse/cctv.env
