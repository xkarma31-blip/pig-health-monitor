# Drop-in: /etc/systemd/system/pigpulse-ap-watchdog.service.d/20-rtl8192cu-calibration.conf
#
# Calibration for the 2026-11-17 radio-role swap: the AP now runs on the USB
# RTL8188CUS dongle (rtl8192cu), but this watchdog was calibrated for the old
# onboard brcmfmac AP. Measured on 2026-11-17:
#   - rate check (PIGPULSE_AP_MIN_RATE=40) restarted hostapd three times in ten
#     minutes (17:42, 17:44, 17:51) on a weak mic link; each restart drops ALL
#     clients and never restored the mic.
#   - the ghost check deauthenticated the mic at 18:40:22 after 61 s of frozen
#     rx + failed ICMP. The mic never rejoined. Its flashed firmware recovers
#     on its own in 900 s (full chip restart), so a watchdog eviction at 61 s
#     can only preempt that recovery.
#
# Keep power-save re-assertion and logging; make the two destructive decisions
# conservative on this radio. Reversible: remove this drop-in, daemon-reload.
[Service]
Environment=PIGPULSE_AP_MIN_RATE=0
Environment=PIGPULSE_AP_STUCK_S=1800
